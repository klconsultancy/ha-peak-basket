name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  # A required check of the merge queue: it must report on the queue's merge group too.
  # The title was checked on the pull request; the group has none to check.
  merge_group:

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional commit title
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'merge_group'
        run: echo "Checked on the pull request."
