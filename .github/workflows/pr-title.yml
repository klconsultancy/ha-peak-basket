name: PR title

# The title becomes the squash commit on main, from which release-please derives the next
# version and the changelog. The organization's reusable check runs on pull_request, not
# pull_request_target: it only reads the title, which a read-only token can, and GitHub
# blocks pull_request_target by default in public repositories. The required status check
# is "PR title / Conventional commit title".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A required check of the merge queue: it must report on the queue's merge group too.
  # The title was checked on the pull request; the group has none to check.
  merge_group:

permissions: {}

jobs:
  title:
    name: PR title
    permissions:
      pull-requests: read
    uses: klconsultancy/workflows/.github/workflows/pr-title.yml@6d3966cda724c8842fd2185f372eacc6c6c2474e # main
