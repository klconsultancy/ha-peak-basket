name: zizmor

# Audits the workflows: unpinned actions, too-wide permissions, template injection,
# credentials left in a checkout.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/zizmor.yml@e6939b6be36b833baf87de0ce25c0ff4cac96b2f # v1.0.0
