name: zizmor

# Audits the workflows: unpinned actions, too-wide permissions, template injection,
# credentials left in a checkout.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
