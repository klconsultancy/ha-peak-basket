name: zizmor

# Audits the workflows: unpinned actions, too-wide permissions, template injection,
# credentials left in a checkout.
on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/zizmor.yml@153c11cfe93c94e30a657a6d43f55ec44e6e13b8 # v1.0.1
