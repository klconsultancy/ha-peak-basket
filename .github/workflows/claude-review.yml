name: Claude review

# Claude reviews every pull request against AGENTS.md (via CLAUDE.md), with the
# organization's reusable workflow: inline comments, never an approval.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    name: Review
    permissions:
      actions: read # the last successful review's head SHA, for an incremental review
      contents: read
      pull-requests: read
      issues: read
      id-token: write # the action authenticates as the Claude GitHub App
    uses: klconsultancy/workflows/.github/workflows/claude-review.yml@e6939b6be36b833baf87de0ce25c0ff4cac96b2f # v1.0.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
