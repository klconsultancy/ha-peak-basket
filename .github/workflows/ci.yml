name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # HACS and hassfest validate against rules that change without a commit here.
  schedule:
    - cron: "41 3 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ruff, mypy and pytest from the locked environment, and the uv pins that Renovate groups.
  python:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/python-uv.yml@c9502596494c47704b890d5cc66de73c06ba93d8 # main
    with:
      python-version: "3.14" # same as the devcontainer
      check-uv-pins: true

  # hassfest and the HACS action.
  home-assistant:
    permissions:
      contents: read
    uses: klconsultancy/workflows/.github/workflows/home-assistant.yml@c9502596494c47704b890d5cc66de73c06ba93d8 # main

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Single required status check for the branch ruleset.
  ci-success:
    name: CI success
    if: always()
    permissions: {}
    needs: [python, home-assistant, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
